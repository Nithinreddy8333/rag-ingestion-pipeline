name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,orchestration]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: End-to-end demo (offline embedder, embedded Qdrant)
        run: make demo
      - name: Retrieval and incremental evals (regression gate)
        run: make evals
      - name: Dagster definitions load
        run: dagster definitions validate -m orchestration.definitions
