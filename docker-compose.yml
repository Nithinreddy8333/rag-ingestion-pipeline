# docker compose run --rm ingest    -> generate the corpus and ingest it into the Qdrant server
# docker compose up api             -> search API on http://localhost:8000/docs
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant:/qdrant/storage

  ingest:
    build: .
    depends_on: [qdrant]
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBED_PROVIDER: ${EMBED_PROVIDER:-hashing}
      EMBED_MODEL: ${EMBED_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - state:/app/state
      - docs:/app/data/docs
    command: sh -c "rag-ingest generate-corpus && rag-ingest ingest"

  api:
    build: .
    depends_on: [qdrant]
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBED_PROVIDER: ${EMBED_PROVIDER:-hashing}
      EMBED_MODEL: ${EMBED_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - state:/app/state
      - docs:/app/data/docs
    ports:
      - "8000:8000"
    command: uvicorn rag_ingest.api:app --host 0.0.0.0 --port 8000

volumes:
  qdrant:
  state:
  docs:
