[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-ingest"
version = "0.1.0"
description = "Incremental, tested document ingestion for RAG: change detection, structure-aware chunking, embedding cache, quality gates, hybrid search and retrieval evals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "qdrant-client>=1.12",
    "numpy>=1.26",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
local-models = ["sentence-transformers>=3"]
orchestration = ["dagster>=1.9", "dagster-webserver>=1.9"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
rag-ingest = "rag_ingest.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/rag_ingest/corpus.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
