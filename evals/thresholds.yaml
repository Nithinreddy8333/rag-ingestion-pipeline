    mode: hybrid
    metrics: {"doc@1": 0.93, "sec@5": 0.88, "mrr@10": 0.58}
  - chunking: "heading-aware (180)"
    mode: sparse
    metrics: {"doc@1": 0.93, "sec@5": 0.86}
  - chunking: "heading-aware (180)"
    mode: dense
    metrics: {"doc@1": 0.93, "sec@5": 0.85}
